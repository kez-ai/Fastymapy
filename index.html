<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fastest Route Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:rgba(17,23,26,.88);--card:#1c262b;--card2:#26333a;--ink:#e8efec;--mute:#92a39c;--line:rgba(255,255,255,.09);--accent:#5eead4;--amber:#fbbf24;--bad:#fca5a5}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#0d1316;position:relative;overflow:hidden}
  #map{position:absolute;inset:0;background:#0d1316;cursor:crosshair}
  .leaflet-pane.leaflet-base-pane{transition:filter .3s}
  .styleSwitch{display:flex;flex-direction:column;background:var(--bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4);margin-top:10px!important}
  .styleSwitch button{width:34px;height:34px;border:0;background:none;font-size:16px;opacity:.55;padding:0;transition:opacity .15s,background .15s}
  .styleSwitch button[data-k=labels]{font-size:13px;font-weight:700;color:var(--ink)}
  .styleSwitch button.on{opacity:1;background:var(--card2)}
  .leaflet-control-scale-line{background:rgba(13,19,22,.7)!important;color:var(--mute)!important;border-color:var(--mute)!important;font-size:10px}
  .leaflet-control-zoom{border:0!important;box-shadow:0 2px 10px rgba(0,0,0,.4)!important}
  .leaflet-control-zoom a{background:var(--bg)!important;color:var(--ink)!important;border:0!important;backdrop-filter:blur(8px)}
  .leaflet-control-attribution{background:rgba(13,19,22,.7)!important;color:var(--mute)!important;font-size:10px}
  .leaflet-control-attribution a{color:var(--mute)!important}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus{outline:2px solid var(--accent);outline-offset:1px}

  #panel{position:absolute;z-index:1000;top:12px;left:12px;width:320px;max-height:calc(100% - 24px);background:var(--bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
  #head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
  #hint{flex:1;font-size:14px;line-height:1.35;color:var(--ink)}
  #fold{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
  #fold svg{transition:transform .2s}
  #panel.collapsed #fold svg{transform:rotate(180deg)}
  #panel.collapsed .body,#panel.collapsed #keyBox{display:none!important}
  #mini{display:none;padding:0 14px 12px;font-size:13px;color:var(--mute)}
  #panel.collapsed #mini:not(:empty){display:block}
  summary{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);cursor:pointer;list-style:none;padding:6px 0;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'+';font-size:15px;line-height:1}
  details[open]>summary::after{content:'\2212'}
  details{border-top:1px solid var(--line);padding-top:4px}
  details>*:not(summary){margin-top:8px}
  .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
  .seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;padding:8px 6px;border:0;background:none;border-radius:8px;font-size:14px;color:var(--mute)}
  .seg button.on{background:var(--accent);color:#06201b;font-weight:600}
  .row2{display:flex;gap:8px}
  .btn{flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;color:var(--ink)}
  .btn:hover{background:var(--card2)}
  #result{font-size:13px;line-height:1.5;color:var(--mute)}
  #result:empty{display:none}
  #result .big{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  #result .err{color:var(--bad)}
  #result .dash{color:#d5dcd9}
  h2{font-size:11px;margin:0 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  #scSave{display:flex;gap:6px}
  #scSave input,#keyInput{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px}
  #scSave input::placeholder,#keyInput::placeholder{color:#62736b}
  .sm{padding:7px 10px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-size:13px}
  .sm:hover{background:var(--card2)}
  #scList{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .scRow{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:10px;padding:5px 6px 5px 10px}
  .scRow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scRow .sm{background:var(--card2);padding:5px 9px}
  .scRow .del{color:var(--bad);padding:5px 8px}
  #scEmpty{font-size:12px;color:var(--mute);line-height:1.4}
  #keyBox{padding:0 14px 14px;display:none;flex-direction:column;gap:8px;font-size:13px;color:var(--mute)}
  #keyBox a{color:var(--accent)}
  #saveKey{padding:10px;border:0;border-radius:10px;background:var(--accent);color:#06201b;font-weight:600}
  #changeKey{background:none;border:0;color:var(--mute);font-size:12px;padding:2px 0;text-align:left;text-decoration:underline}
  #pathHelp{font-size:12px;color:var(--mute);line-height:1.4;margin-bottom:8px}
  #drawForm{display:none;flex-direction:column;gap:8px;background:var(--card);border-radius:12px;padding:10px;margin-top:8px}
  #drawForm input[type=text]{padding:8px 10px;border:1px solid var(--line);background:#141c20;border-radius:9px;font-size:14px;width:100%}
  .chips{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
  .chips label,.pRow label{display:flex;align-items:center;gap:5px}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  #pathList{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .pRow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:6px 6px 6px 10px}
  .pRow .nm{flex:1;min-width:0;font-size:14px}
  .pRow .nm small{display:block;color:var(--mute);font-size:11px}
  .pRow .del{color:var(--bad);padding:5px 9px;background:var(--card2)}
  .pin{width:28px;height:28px;border-radius:50%;border:2px solid #0d1316;color:#06201b;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.55),0 3px 8px rgba(0,0,0,.5)}
  .me{width:16px;height:16px;border-radius:50%;background:#60a5fa;border:3px solid #fff;box-shadow:0 0 0 6px rgba(96,165,250,.3)}

  /* ---- polish ---- */
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadein{from{opacity:0}}
  #panel{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
  #main{animation:rise .25s ease}
  .body{scrollbar-width:thin;scrollbar-color:#3a4a52 transparent}
  .btn,.sm,.seg button,#saveKey,#fold{transition:background .18s,color .18s,transform .12s,border-color .18s}
  .btn:active,.sm:active,.seg button:active,#saveKey:active,#fold:active{transform:scale(.96)}
  .btn:hover,.sm:hover,#fold:hover{border-color:rgba(255,255,255,.2)}
  .btn{min-height:40px}
  .seg button{min-height:38px}
  .pin{animation:pop .3s ease-out;transition:transform .15s}
  .leaflet-marker-draggable:hover .pin{transform:scale(1.12)}
  .route-in{animation:fadein .5s ease}
  #hint{font-weight:500;font-size:14.5px}
  #panel.busy #hint::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .7s linear infinite}
  #result:not(:empty){background:var(--card);border-radius:12px;padding:12px 14px;animation:rise .3s ease}
  #result .big{font-size:28px}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{background:var(--card2);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:12px}
  .note{margin-top:8px;font-size:12.5px;color:var(--mute);line-height:1.45}
  .note b{color:var(--amber);font-weight:600}
  .scRow,.pRow{transition:background .15s}
  .scRow:hover,.pRow:hover{background:var(--card2)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:640px){
    #head{padding-top:16px;position:relative}
    #head::before{content:'';position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.25)}
    #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:58%;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0)}
    .leaflet-bottom{bottom:0}
    .leaflet-top.leaflet-left{top:env(safe-area-inset-top,0)}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="head"><div id="hint">Setting things up...</div><button id="fold" type="button" aria-label="Fold or unfold menu" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5l5 5 5-5"/></svg></button></div>
  <div id="mini"></div>
  <div id="keyBox">
    <span>Paste your free TomTom API key from <a href="https://developer.tomtom.com" target="_blank" rel="noopener">developer.tomtom.com</a>. It stays in this browser only.</span>
    <input id="keyInput" type="text" placeholder="TomTom API key" autocomplete="off" spellcheck="false">
    <button id="saveKey" type="button">Save key</button>
  </div>
  <div class="body" id="main" style="display:none">
    <div class="seg" id="modes">
      <button type="button" data-m="car" class="on">🚗 Drive</button>
      <button type="button" data-m="bicycle">🚲 Cycle</button>
      <button type="button" data-m="pedestrian">🚶 Walk</button>
    </div>
    <div id="result" aria-live="polite"></div>
    <button class="btn" id="locate" type="button">📍 Use my location as start</button>
    <div class="row2">
      <button class="btn" id="clearA" type="button">Clear A</button>
      <button class="btn" id="clearB" type="button">Clear B</button>
      <button class="btn" id="clearAll" type="button">Clear both</button>
    </div>
    <details id="paths">
      <summary>Shortcuts the map can't see</summary>
      <div id="pathHelp">Add a footpath, gate or private road. Routes will use it whenever it saves time.</div>
      <button class="btn" id="addPath" type="button" style="width:100%">+ Add a shortcut</button>
      <div id="drawForm">
        <input id="pathName" type="text" placeholder="Name, e.g. Field path" maxlength="30" autocomplete="off">
        <div class="chips"><span>Usable by:</span>
          <label><input type="checkbox" id="mCar" checked> Drive</label>
          <label><input type="checkbox" id="mBike" checked> Cycle</label>
          <label><input type="checkbox" id="mFoot" checked> Walk</label>
        </div>
        <div class="row2">
          <button class="btn" id="pathUndo" type="button">Undo point</button>
          <button class="btn" id="pathSave" type="button">Save</button>
          <button class="btn" id="pathCancel" type="button">Cancel</button>
        </div>
      </div>
      <div id="pathList"></div>
    </details>
    <details>
      <summary>Saved places</summary>
      <div id="scSave">
        <input id="scName" type="text" placeholder="Name, e.g. Home" maxlength="30" autocomplete="off">
        <button class="sm" id="saveA" type="button">Save A</button>
        <button class="sm" id="saveB" type="button">Save B</button>
      </div>
      <div id="scList"></div>
    </details>
    <button id="changeKey" type="button">Change API key</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map('map', {minZoom: 2, maxZoom: 19, zoomControl: false, zoomSnap: .5, zoomDelta: .5, wheelPxPerZoomLevel: 90}).setView([53.3, -7.7], 7);
map.createPane('base'); map.getPane('base').classList.add('leaflet-base-pane'); map.getPane('base').style.zIndex = 200;
map.createPane('labels'); map.getPane('labels').style.zIndex = 250; map.getPane('labels').style.pointerEvents = 'none';
L.control.scale({position: 'bottomright', imperial: false}).addTo(map);
L.control.zoom({position: 'topright'}).addTo(map);
let KEY = '', tiles = null, hintBase = '';
const markers = [null, null];
const both = () => !!(markers[0] && markers[1]);
let routeLayers = [], mode = 'car', reqId = 0;
const DEFAULT_KEY = '91V21ukhFBicZG2HdbBE1A0zAZpbBx1t';
try { KEY = localStorage.getItem('tomtom_key') || ''; } catch (e) {}
if (!KEY) KEY = DEFAULT_KEY;

$('head').onclick = () => {
  const c = $('panel').classList.toggle('collapsed');
  $('fold').setAttribute('aria-expanded', String(!c));
};
const setHint = t => { $('hint').textContent = t; };

let styleName = 'satellite', showLabels = false;
try { styleName = localStorage.getItem('tomtom_style') || 'satellite'; showLabels = localStorage.getItem('tomtom_labels') === '1'; } catch (e) {}
function buildTiles(){
  if (tiles) { map.removeLayer(tiles); tiles = null; }
  if (!KEY) return;
  const k = encodeURIComponent(KEY);
  const hi = {tileSize: 512, zoomOffset: -1, minZoom: 1, maxZoom: 19};
  const url = (layer, style, ext) => 'https://api.tomtom.com/map/1/tile/' + layer + '/' + style + '/{z}/{x}/{y}.' + ext + '?key=' + k + '&tileSize=512';
  const layers = [];
  if (styleName === 'satellite') {
    const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    layers.push(L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {pane: 'base', maxNativeZoom: 19, maxZoom: 19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'}));
    if (showLabels) layers.push(L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {pane: 'labels', maxNativeZoom: 19, maxZoom: 19, opacity: .95}));
  } else {
    layers.push(L.tileLayer(url('basic', styleName === 'dark' ? 'night' : 'main', 'png'), Object.assign({pane: 'base', attribution: '&copy; TomTom'}, hi)));
  }
  map.getPane('base').style.filter = 'none';
  tiles = L.layerGroup(layers).addTo(map);
  document.querySelectorAll('.styleSwitch button').forEach(b => {
    if (b.dataset.k === 'labels') { b.style.display = styleName === 'satellite' ? '' : 'none'; b.classList.toggle('on', showLabels); }
    else b.classList.toggle('on', b.dataset.k === styleName);
  });
}
const StyleCtl = L.Control.extend({onAdd(){
  const d = L.DomUtil.create('div', 'styleSwitch');
  [['satellite', '\u{1F6F0}\uFE0F', 'Satellite'], ['dark', '\u{1F319}', 'Dark'], ['light', '\u2600\uFE0F', 'Light'], ['labels', 'Aa', 'Place names']].forEach(([k, e, t]) => {
    const b = L.DomUtil.create('button', k === styleName ? 'on' : '', d);
    b.type = 'button'; b.textContent = e; b.title = t; b.setAttribute('aria-label', t + ' map'); b.dataset.k = k;
  });
  L.DomEvent.disableClickPropagation(d);
  d.addEventListener('click', ev => {
    const k = ev.target.dataset && ev.target.dataset.k;
    if (!k) return;
    if (k === 'labels') { showLabels = !showLabels; try { localStorage.setItem('tomtom_labels', showLabels ? '1' : '0'); } catch (e) {} buildTiles(); return; }
    styleName = k;
    try { localStorage.setItem('tomtom_style', k); } catch (e) {}
    buildTiles();
  });
  return d;
}});
new StyleCtl({position: 'topright'}).addTo(map);

function applyKey(){
  if (tiles) { map.removeLayer(tiles); tiles = null; }
  if (!KEY) { $('keyBox').style.display = 'flex'; $('main').style.display = 'none'; setHint('Add your TomTom key to begin'); return; }
  buildTiles();
  $('keyBox').style.display = 'none';
  $('main').style.display = 'flex';
}
$('saveKey').onclick = () => {
  const v = $('keyInput').value.trim();
  if (!v) return;
  KEY = v;
  try { localStorage.setItem('tomtom_key', KEY); } catch (e) {}
  applyKey();
  if (both()) findRoute(); else if (!markers[0]) locate(); else updateHint();
};
$('changeKey').onclick = () => { $('keyInput').value = KEY; $('keyBox').style.display = 'flex'; $('main').style.display = 'none'; setHint('Update your TomTom key'); };

const pinIcon = (label, color) => L.divIcon({className: '', html: '<div class="pin" style="background:' + color + '">' + label + '</div>', iconSize: [28, 28], iconAnchor: [14, 14]});
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(m >= 100000 ? 0 : 1) + ' km' : Math.round(m) + ' m';
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? h + ' h ' + m + ' min' : Math.max(1, m) + ' min'; };
const names = {car: 'car', bicycle: 'bike', pedestrian: 'foot'};

function updateHint(){
  setHint(!markers[0] ? 'Tap the map to set your start'
    : !markers[1] ? 'Tap the map to set your destination'
    : 'Drag a pin to adjust the route');
}
function clearRoute(){ routeLayers.forEach(l => map.removeLayer(l)); routeLayers = []; $('result').innerHTML = ''; $('mini').textContent = ''; }
function fitPad(){
  const p = $('panel').getBoundingClientRect();
  const narrow = window.innerWidth <= 640;
  return narrow ? {paddingTopLeft: [30, 60], paddingBottomRight: [30, p.height + 30]} : {paddingTopLeft: [p.width + 50, 50], paddingBottomRight: [60, 50]};
}

function buzz(){ try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
function addMarker(latlng, i){
  buzz();
  const m = L.marker(latlng, {draggable: true, icon: pinIcon(i === 0 ? 'A' : 'B', i === 0 ? '#5eead4' : '#fbbf24')}).addTo(map);
  m.on('dragend', findRoute);
  return m;
}
map.on('click', e => {
  if (drawing) { drawClick(e.latlng); return; }
  if (!KEY || both()) return;
  const i = markers[0] ? 1 : 0;
  markers[i] = addMarker(e.latlng, i);
  updateHint();
  if (both()) findRoute();
});

function locate(){
  if (!window.isSecureContext || !navigator.geolocation) {
    setHint('Location only works when this page is hosted online (https). Tap the map to set your start instead.');
    return;
  }
  setHint('Finding your location...');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    if (markers[0]) map.removeLayer(markers[0]);
    markers[0] = addMarker(ll, 0);
    if (!both()) map.setView(ll, 14);
    updateHint();
    if (both()) findRoute();
  }, err => {
    setHint(err && err.code === 1 ? 'Location is blocked. Allow it in your browser site settings, or tap the map to set a start.' : 'Could not get your location. Tap the map to set a start.');
  }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 30000});
}
$('locate').onclick = locate;

$('modes').addEventListener('click', e => {
  const m = e.target.dataset.m;
  if (!m) return;
  mode = m;
  [...$('modes').children].forEach(b => b.classList.toggle('on', b === e.target));
  if (both()) findRoute();
});
function clearPins(which){
  reqId++; if (ctrl) ctrl.abort(); $('panel').classList.remove('busy');
  which.forEach(i => { if (markers[i]) map.removeLayer(markers[i]); markers[i] = null; });
  clearRoute(); updateHint();
}
$('clearA').onclick = () => clearPins([0]);
$('clearB').onclick = () => clearPins([1]);
$('clearAll').onclick = () => clearPins([0, 1]);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const abortErr = () => { const e = new Error('aborted'); e.name = 'AbortError'; return e; };
let nextAt = 0, ctrl = null;
async function throttle(sig){            // TomTom's free plan allows about 5 requests per second
  const now = Date.now(), at = Math.max(now, nextAt);
  nextAt = at + 260;
  if (at > now) await sleep(at - now);
  if (sig && sig.aborted) throw abortErr();
}
async function ttFetch(url, sig){
  for (let attempt = 0; attempt < 4; attempt++) {
    await throttle(sig);
    const r = await fetch(url, {signal: sig});
    if (r.status === 429 || r.status >= 500) { await sleep(600 * (attempt + 1)); if (sig && sig.aborted) throw abortErr(); continue; }
    return r;
  }
  throw new Error('TomTom is busy (too many requests). Wait a few seconds and try again.');
}
async function getRoute(a, b, type, sig){
  const url = 'https://api.tomtom.com/routing/1/calculateRoute/' + a.lat + ',' + a.lng + ':' + b.lat + ',' + b.lng +
    '/json?key=' + encodeURIComponent(KEY) + '&routeType=' + type + '&travelMode=' + mode + (mode === 'car' && type === 'fastest' ? '&traffic=true' : '');
  const r = await ttFetch(url, sig);
  if (r.status === 403 || r.status === 401) throw new Error('TomTom rejected the API key. Use "Change API key" below.');
  if (!r.ok) {
    let msg = '';
    try { const j = await r.json(); msg = (j.error && j.error.description) || (j.detailedError && j.detailedError.message) || ''; } catch (e) {}
    throw new Error('No route found for this travel mode' + (msg ? ' (' + msg + ')' : '') + '. Try moving a pin closer to a road or path.');
  }
  const d = await r.json();
  if (!d.routes || !d.routes.length) throw new Error('No route found between these spots.');
  const rt = d.routes[0];
  return {dist: rt.summary.lengthInMeters, time: rt.summary.travelTimeInSeconds, arrive: rt.summary.arrivalTime,
    pts: rt.legs.flatMap(l => l.points.map(p => [p.latitude, p.longitude]))};
}

// ---------- Shortcut paths (ways the map can't see) ----------
const SPEED = {car: 8.3, bicycle: 4.2, pedestrian: 1.4};
const MODEKEY = {car: 'car', bicycle: 'bike', pedestrian: 'foot'};
let paths = [], drawing = null;
try { paths = JSON.parse(localStorage.getItem('tomtom_paths') || '[]'); } catch (e) { paths = []; }
const savePaths = () => { try { localStorage.setItem('tomtom_paths', JSON.stringify(paths)); } catch (e) {} };
const pathLayer = L.layerGroup().addTo(map);
const toLL = pts => pts.map(p => L.latLng(p[0], p[1]));
const plen = ll => ll.reduce((t, p, i) => i ? t + ll[i - 1].distanceTo(p) : 0, 0);
const modeList = p => [p.modes.car && 'drive', p.modes.bicycle && 'cycle', p.modes.pedestrian && 'walk'].filter(Boolean).join(', ');

function renderPaths(){
  pathLayer.clearLayers();
  const box = $('pathList'); box.innerHTML = '';
  paths.forEach((p, idx) => {
    const ll = toLL(p.pts), op = p.on ? .95 : .3;
    L.polyline(ll, {color: '#fbbf24', weight: 4, opacity: op, dashArray: '6 7', interactive: false}).addTo(pathLayer);
    [ll[0], ll[ll.length - 1]].forEach(pt => L.circleMarker(pt, {radius: 5, color: '#0d1316', weight: 2, fillColor: '#fbbf24', fillOpacity: op, opacity: op, interactive: false}).addTo(pathLayer));
    const row = document.createElement('div'); row.className = 'pRow';
    const lab = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = p.on; cb.title = 'Use this shortcut';
    cb.onchange = () => { p.on = cb.checked; savePaths(); renderPaths(); if (both()) findRoute(); };
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
    const sm = document.createElement('small'); sm.textContent = fmtDist(plen(ll)) + ' · ' + modeList(p); nm.appendChild(sm);
    lab.append(cb); row.append(lab, nm);
    const del = document.createElement('button'); del.type = 'button'; del.className = 'sm del'; del.textContent = '\u00d7';
    del.onclick = () => { paths.splice(idx, 1); savePaths(); renderPaths(); if (both()) findRoute(); };
    row.append(del); box.appendChild(row);
  });
}

function drawRedraw(){
  drawing.line.setLatLngs(drawing.pts);
  drawing.dots.clearLayers();
  drawing.pts.forEach(pt => L.circleMarker(pt, {radius: 5, color: '#0d1316', weight: 2, fillColor: '#fbbf24', fillOpacity: 1, interactive: false}).addTo(drawing.dots));
}
function drawClick(ll){ drawing.pts.push(ll); drawRedraw(); setHint(drawing.pts.length + ' point' + (drawing.pts.length > 1 ? 's' : '') + '. Keep tapping along the path, then press Save.'); }
function endDrawing(){
  if (drawing) { map.removeLayer(drawing.line); map.removeLayer(drawing.dots); drawing = null; }
  $('drawForm').style.display = 'none'; $('addPath').style.display = ''; $('pathName').value = '';
  updateHint();
}
$('addPath').onclick = () => {
  drawing = {pts: [], line: L.polyline([], {color: '#fbbf24', weight: 4, dashArray: '6 7', interactive: false}).addTo(map), dots: L.layerGroup().addTo(map)};
  $('drawForm').style.display = 'flex'; $('addPath').style.display = 'none';
  setHint('Tap the map where the shortcut starts, then along it to the end.');
  if (window.innerWidth <= 640) $('panel').classList.add('collapsed');
};
$('pathUndo').onclick = () => { if (drawing && drawing.pts.length) { drawing.pts.pop(); drawRedraw(); } };
$('pathCancel').onclick = endDrawing;
$('pathSave').onclick = () => {
  if (!drawing || drawing.pts.length < 2) { setHint('Tap at least 2 points on the map first.'); return; }
  const modes = {car: $('mCar').checked, bicycle: $('mBike').checked, pedestrian: $('mFoot').checked};
  if (!modes.car && !modes.bicycle && !modes.pedestrian) { setHint('Pick at least one way of travelling.'); return; }
  paths.push({id: Date.now(), name: $('pathName').value.trim() || ('Shortcut ' + (paths.length + 1)), pts: drawing.pts.map(p => [+p.lat.toFixed(6), +p.lng.toFixed(6)]), modes: modes, on: true});
  savePaths(); endDrawing(); renderPaths();
  if (both()) findRoute();
};

function candidatesFor(a, b){
  const direct = a.distanceTo(b), out = [];
  paths.filter(p => p.on && p.modes[mode]).forEach(p => {
    const fwd = toLL(p.pts), len = plen(fwd);
    [fwd, fwd.slice().reverse()].map(pts => ({p, pts, len, est: a.distanceTo(pts[0]) + len + pts[pts.length - 1].distanceTo(b)}))
      .sort((x, y) => x.est - y.est).slice(0, 1).forEach(c => { if (c.est <= direct * 1.6 + 400) out.push(c); });
  });
  return out.sort((x, y) => x.est - y.est).slice(0, 3);
}
async function getLeg(a, b, sig){
  const d = a.distanceTo(b);
  if (d < 15) return {dist: d, time: 0, pts: []};
  return getRoute(a, b, 'fastest', sig);
}

async function findRoute(){
  if (!both() || !KEY) return;
  const id = ++reqId;
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  const sig = ctrl.signal;
  const a = markers[0].getLatLng(), b = markers[1].getLatLng();
  setHint('Finding the fastest route...');
  $('panel').classList.add('busy');
  try {
    const cands = candidatesFor(a, b);
    const soft = p => p.catch(e => { if (e && e.name === 'AbortError') throw e; return {error: e}; });
    let [fastest, shortest, combos] = await Promise.all([
      soft(getRoute(a, b, 'fastest', sig)),
      soft(getRoute(a, b, 'shortest', sig)),
      Promise.all(cands.map(async c => {
        try {
          const first = c.pts[0], last = c.pts[c.pts.length - 1];
          const [l1, l2] = await Promise.all([getLeg(a, first, sig), getLeg(last, b, sig)]);
          const cpts = c.pts.map(p => [p.lat, p.lng]);
          return {via: c.p.name, cpts: cpts, time: l1.time + c.len / SPEED[mode] + l2.time, dist: l1.dist + c.len + l2.dist, pts: [...l1.pts, ...cpts, ...l2.pts]};
        } catch (e) { if (e && e.name === 'AbortError') throw e; return null; }
      }))
    ]);
    if (id !== reqId) return;
    if (shortest && shortest.error) shortest = null;
    if (fastest.error) { if (shortest) fastest = shortest; else throw fastest.error; }
    clearRoute();
    const plain = {via: null, time: fastest.time, dist: fastest.dist, pts: fastest.pts, arrive: fastest.arrive};
    const ok = combos.filter(Boolean);
    const bestFast = [plain, ...ok].reduce((x, y) => y.time < x.time - 5 ? y : x);
    const shortPool = (shortest ? [{via: null, time: shortest.time, dist: shortest.dist, pts: shortest.pts}] : []).concat(ok);
    const bestShort = shortPool.length ? shortPool.reduce((x, y) => y.dist < x.dist - 5 ? y : x) : null;
    const differs = bestShort && Math.abs(bestShort.dist - bestFast.dist) > 50;
    if (differs) routeLayers.push(L.polyline(bestShort.pts, {className: 'route-in', color: '#e5e7eb', weight: 4, opacity: .85, dashArray: '2 9', lineCap: 'round'}).addTo(map));
    routeLayers.push(L.polyline(bestFast.pts, {className: 'route-in', color: '#06100e', weight: 11, opacity: .7, lineCap: 'round', lineJoin: 'round'}).addTo(map));
    const line = L.polyline(bestFast.pts, {className: 'route-in', color: '#5eead4', weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round'}).addTo(map);
    routeLayers.push(line);
    if (bestFast.via) routeLayers.push(L.polyline(bestFast.cpts, {className: 'route-in', color: '#fbbf24', weight: 6, opacity: 1, lineCap: 'round'}).addTo(map));
    map.fitBounds(line.getBounds(), fitPad());
    updateHint();
    const esc = t => String(t).replace(/</g, '&lt;');
    let html = '<div class="big">' + fmtTime(bestFast.time) + '</div><div class="meta"><span class="tag">' + fmtDist(bestFast.dist) + '</span><span class="tag">by ' + names[mode] + '</span>';
    if (!bestFast.via && fastest.arrive) { try { html += '<span class="tag">arrive ' + new Date(fastest.arrive).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) + '</span>'; } catch (e) {} }
    html += '</div>';
    if (bestFast.via) html += '<div class="note">Uses your shortcut <b>' + esc(bestFast.via) + '</b> (amber), saving about ' + fmtTime(fastest.time - bestFast.time) + '.</div>';
    if (differs) html += '<div class="note"><span class="dash">Dotted line:</span> shortest by distance, ' + fmtDist(bestShort.dist) + ', ' + fmtTime(bestShort.time) + (bestShort.via ? ' (via ' + esc(bestShort.via) + ')' : '') + '.</div>';
    $('result').innerHTML = html;
    $('mini').textContent = fmtTime(bestFast.time) + ' \u00b7 ' + fmtDist(bestFast.dist) + ' by ' + names[mode] + (bestFast.via ? ' \u00b7 via ' + bestFast.via : '');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    if (id === reqId) { setHint('Route problem'); $('result').innerHTML = '<div class="err">' + e.message + '</div>'; }
  } finally {
    if (id === reqId) $('panel').classList.remove('busy');
  }
}

// ---------- Shortcuts (saved places) ----------
let shortcuts = [];
try { shortcuts = JSON.parse(localStorage.getItem('tomtom_shortcuts') || '[]'); } catch (e) { shortcuts = []; }
function saveShortcuts(){ try { localStorage.setItem('tomtom_shortcuts', JSON.stringify(shortcuts)); } catch (e) {} }

function usePlace(i, sc){
  const ll = L.latLng(sc.lat, sc.lng);
  if (i === 1 && !markers[0]) { setHint('Set a start (A) first, then choose an end.'); return; }
  if (markers[i]) map.removeLayer(markers[i]);
  markers[i] = addMarker(ll, i);
  if (both()) findRoute(); else { map.setView(ll, 14); updateHint(); }
}
function renderShortcuts(){
  const box = $('scList');
  box.innerHTML = '';
  if (!shortcuts.length) { const d = document.createElement('div'); d.id = 'scEmpty'; d.textContent = 'Nothing saved yet. Place a pin, type a name, then tap Save A or Save B.'; box.appendChild(d); return; }
  shortcuts.forEach((sc, idx) => {
    const row = document.createElement('div'); row.className = 'scRow';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = sc.name; nm.title = sc.name;
    const mk = (label, fn, cls) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sm ' + (cls || ''); b.textContent = label; b.onclick = fn; return b; };
    row.append(nm, mk('Start', () => usePlace(0, sc)), mk('End', () => usePlace(1, sc)),
      mk('\u00d7', () => { shortcuts.splice(idx, 1); saveShortcuts(); renderShortcuts(); }, 'del'));
    box.appendChild(row);
  });
}
function saveFromPin(i){
  if (!markers[i]) { setHint('Pin ' + (i === 0 ? 'A' : 'B') + ' is not placed yet.'); return; }
  const ll = markers[i].getLatLng();
  const name = $('scName').value.trim() || ('Place ' + (shortcuts.length + 1));
  const ex = shortcuts.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
  const entry = {name: name, lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6)};
  if (ex >= 0) shortcuts[ex] = entry; else shortcuts.push(entry);
  saveShortcuts(); renderShortcuts(); $('scName').value = '';
}
$('saveA').onclick = () => saveFromPin(0);
$('saveB').onclick = () => saveFromPin(1);
renderShortcuts();
renderPaths();

applyKey();
if (KEY) locate();
</script>
</body>
</html>
